<script>
    document.addEventListener('DOMContentLoaded', () => {
        const houselessPeriodSelect = document.getElementById('houselessPeriod');
        const dependentsSelect = document.getElementById('dependents');
        const subscriptionPeriodSelect = document.getElementById('subscriptionPeriod');
        const calculateBtn = document.getElementById('calculateBtn');
        const resultDiv = document.getElementById('result');
        const totalPointsSpan = document.getElementById('totalPoints');
        const houselessPointsSpan = document.getElementById('houselessPoints');
        const dependentPointsSpan = document.getElementById('dependentPoints');
        const subscriptionPointsSpan = document.getElementById('subscriptionPoints');

        // 무주택기간 가점 계산 함수 (최대 32점)
        const calculateHouselessPoints = (periodIndex) => {
            // periodIndex는 <select> option의 value 값 (0부터 16까지)
            // 0: 0년 미만 -> 0점 (가점 대상 아님)
            // 1: 1년 미만 (0년 이상) -> 2점
            // 2: 1년 이상 ~ 2년 미만 -> 4점
            // ...
            // 15: 14년 이상 ~ 15년 미만 -> 30점
            // 16: 15년 이상 -> 32점
            if (periodIndex <= 0) return 0; // 0년 미만은 0점
            if (periodIndex >= 16) return 32; // 15년 이상은 32점
            return periodIndex * 2; // (예: 1년 미만(value=1) -> 1*2=2점, 1년이상~2년미만(value=2) -> 2*2=4점)
        };

        // 부양가족수 가점 계산 함수 (최대 35점)
        const calculateDependentPoints = (dependentsCount) => {
            // dependentsCount는 <select> option의 value 값 (0부터 6까지)
            // 0: 본인만 -> 5점
            // 1: 1명 (본인 외) -> 10점
            // ...
            // 6: 6명 이상 (본인 외) -> 35점
            if (dependentsCount < 0) return 0;
            if (dependentsCount >= 6) return 35; // 6명 이상은 35점
            return (dependentsCount * 5) + 5; // (예: 0명(value=0) -> 0*5+5=5점, 1명(value=1) -> 1*5+5=10점)
        };

        // 청약통장 가입기간 가점 계산 함수 (최대 17점)
        const calculateSubscriptionPeriodPoints = (periodIndex) => {
            // periodIndex는 <select> option의 value 값 (0부터 16까지)
            // 0: 6개월 미만 -> 1점
            // 1: 6개월 이상 ~ 1년 미만 -> 2점
            // 2: 1년 이상 ~ 2년 미만 -> 3점
            // ...
            // 15: 14년 이상 ~ 15년 미만 -> 16점
            // 16: 15년 이상 -> 17점
            if (periodIndex < 0) return 0;
            if (periodIndex >= 16) return 17; // 15년 이상은 17점
            return periodIndex + 1; // (예: 6개월 미만(value=0) -> 0+1=1점, 6개월이상~1년미만(value=1) -> 1+1=2점)
        };


        calculateBtn.addEventListener('click', () => {
            const houselessPeriod = parseInt(houselessPeriodSelect.value);
            const dependents = parseInt(dependentsSelect.value);
            const subscriptionPeriod = parseInt(subscriptionPeriodSelect.value);

            const houselessPts = calculateHouselessPoints(houselessPeriod);
            const dependentPts = calculateDependentPoints(dependents);
            const subscriptionPts = calculateSubscriptionPeriodPoints(subscriptionPeriod);

            const totalPts = houselessPts + dependentPts + subscriptionPts;

            houselessPointsSpan.textContent = `${houselessPts}점`;
            dependentPointsSpan.textContent = `${dependentPts}점`;
            subscriptionPointsSpan.textContent = `${subscriptionPts}점`;
            totalPointsSpan.textContent = `${totalPts}점`;

            resultDiv.style.display = 'block';
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' }); // 결과로 스크롤 이동
        });
    });
</script>
